  <path stroke-width="3.6" stroke-linecap="round" d="M124 118c14-20 26-52 36-84"/>
  <path stroke="var(--lit-argue)" stroke-width="6.5" stroke-linecap="round" d="m157 44 6-20"/>
  <path class="specimen-highlight" stroke-linecap="round" d="m157.6 40 4.4-14"/>
  <circle cx="124" cy="118" r="4" fill="url(#specimen-vi-iron)"/>
  <circle cx="124" cy="118" r="4"/>
  <circle cx="132" cy="104" r="1.8" fill="var(--lit-surface)"/>
  </g>
  <!-- composing stick with a line of type set -->
  <path class="specimen-shadow" d="M152 154h50v2h-50z"/>
  <path fill="url(#specimen-vi-iron)" d="M148 150h52v4h-52zM148 143h3v11h-3zM173 145h3v9h-3z"/>
  <path stroke-width="1" d="M148 150h52v4h-52zM148 143h3v11h-3zM173 145h3v9h-3z"/>
  <path fill="var(--lit-surface)" stroke-width=".7" d="M151.5 145.5h2.6v4.5h-2.6zm2.9 0h2.6v4.5h-2.6zm2.9 0h1.6v4.5h-1.6zm1.9 0h2.6v4.5h-2.6zm2.9 0h2.6v4.5h-2.6zm2.9 0h2.6v4.5h-2.6zm2.9 0h2.4v4.5h-2.4z"/>
  <!-- a short run of copies, one open on top -->
  <path fill="url(#specimen-vi-paper)" d="M204 145h96l2 11H202z"/>
  <path d="M204 145h96l2 11H202z"/>
  <path class="specimen-wear" d="M203 148.5h98m-98 3h98m-99 2.5h100"/>
  <path class="specimen-shadow" d="M212 118l40-6 42 6 6 28H206z"/>
  <path fill="url(#specimen-vi-gutter-l)" d="M214 116l38-6v30l-46 6z"/>
  <path fill="url(#specimen-vi-gutter-r)" d="M252 110l40 6 8 30-48-6z"/>
  <path d="M214 116l38-6 40 6 8 30-48-6-46 6zM252 110v30"/>
  <path class="argue" stroke-width="1.6" d="M249 116.5h6m-6 16h6"/>
