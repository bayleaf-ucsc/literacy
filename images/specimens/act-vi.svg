  <path fill="url(#specimen-vi-iron)" d="M55 38h6v8h-6z"/>
  <path d="M55 38h6v8h-6z"/>
  <path fill="url(#specimen-vi-iron)" d="M30 32v3a28 7 0 0 0 56 0v-3z"/>
  <path d="M30 32v3a28 7 0 0 0 56 0v-3"/>
