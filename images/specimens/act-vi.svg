<?xml-stylesheet href="../../css/theme.css"?>
<?xml-stylesheet href="../../css/site.css"?>
<!-- VI: for readers who came all this way. A tabletop platen press inks in
     all three thread colors; its nameplate reads 127.0.0.1. -->
<svg xmlns="http://www.w3.org/2000/svg" class="lit-specimen" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="specimen-vi-title specimen-vi-desc" focusable="false">
  <title id="specimen-vi-title">A press of your own</title>
  <desc id="specimen-vi-desc">A tabletop platen press on a wooden bench, its round ink disk carrying blue, green and rust ink and its nameplate reading 127.0.0.1. Beside it the first issue of a stapled zine lies open on a stack of copies, and two fresh sheets dry on a line.</desc>
  <defs>
  <linearGradient id="specimen-vi-paper" x2=".6" y2="1"><stop class="specimen-paper-light"/><stop offset="1" class="specimen-paper-shade"/></linearGradient>
  <linearGradient id="specimen-vi-gutter-l"><stop class="specimen-paper-light"/><stop offset=".75" class="specimen-paper-light"/><stop offset="1" class="specimen-paper-shade"/></linearGradient>
  <linearGradient id="specimen-vi-gutter-r" x1="1" x2="0"><stop class="specimen-paper-light"/><stop offset=".75" class="specimen-paper-light"/><stop offset="1" class="specimen-paper-shade"/></linearGradient>
  <linearGradient id="specimen-vi-iron" x2=".9" y2=".6"><stop class="specimen-metal-light"/><stop offset="1" class="specimen-metal-dark"/></linearGradient>
  <linearGradient id="specimen-vi-wood" x2="0" y2="1"><stop class="specimen-wood-light"/><stop offset="1" class="specimen-wood-dark"/></linearGradient>
  <radialGradient id="specimen-vi-sheen" cx=".35" cy=".3" r=".7"><stop class="specimen-sheen" stop-opacity=".45"/><stop offset="1" class="specimen-sheen" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- the morning's sheets, drying on a line of your own -->
  <path stroke-width="1" d="M188 12q62 12 124 0"/>
  <g transform="rotate(-3 215 17)">
  <path class="specimen-shadow" d="M201 21h36v48h-36z"/>
  <path fill="url(#specimen-vi-paper)" d="M198 18h36v48h-36z"/>
  <path stroke-width="1" d="M198 18h36v48h-36z"/>
  <path class="argue" stroke-width="2.4" stroke-linecap="butt" d="M203 27h22"/>
  <path class="teach" stroke-width="1" d="M203 35h26m-26 4h26m-26 4h20m-20 4h26m-26 4h14"/>
  <path class="work" stroke-width="1" d="M203 59h18"/>
  <path fill="var(--lit-surface)" d="M212 12h5v10h-5z"/>
  <path stroke-width="1" d="M212 12h5v10h-5z"/>
  </g>
  <g transform="rotate(2.5 266 18)">
  <path class="specimen-shadow" d="M251 22h36v48h-36z"/>
  <path fill="url(#specimen-vi-paper)" d="M248 19h36v48h-36z"/>
  <path stroke-width="1" d="M248 19h36v48h-36z"/>
  <text x="266" y="46" text-anchor="middle" style="font:500 20px var(--lit-font-body);fill:var(--lit-teach)">Aa</text>
  <path class="specimen-wear" d="M254 54h24"/>
  <text x="266" y="61" text-anchor="middle" style="font:5px var(--lit-font-mono);letter-spacing:.1em">SPECIMEN</text>
  <path fill="var(--lit-surface)" d="M263.5 13h5v10h-5z"/>
  <path stroke-width="1" d="M263.5 13h5v10h-5z"/>
  </g>
  <!-- table -->
  <path fill="url(#specimen-vi-wood)" d="M6 156h308v10H6z"/>
  <path d="M6 156h308M6 166h308"/>
  <path class="specimen-wear" d="M18 159h40m14 0h70m30 3h52m-210 0h28m120-3h60m20 3h38"/>
