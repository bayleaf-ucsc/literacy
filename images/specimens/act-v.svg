<!-- V: two readers you didn't invite. Cut-out letters pasted into a page
     your agent reads (injection); a carbon copy filed beyond the boundary
     (retention). Neither is a claim about any particular provider. -->
<svg xmlns="http://www.w3.org/2000/svg" class="lit-specimen" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="specimen-v-title specimen-v-desc" focusable="false">
  <title id="specimen-v-title">Readers you didn't invite</title>
  <desc id="specimen-v-desc">A page carries a pasted-in line of cut-out letters spelling OBEY, an instruction smuggled into something meant only to be read. Its carbon copy crosses a dashed boundary into a filing drawer labelled KEPT.</desc>
