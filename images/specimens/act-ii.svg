<!-- II: every reply re-reads the whole context. Eight turns write eight lines
     and read thirty-six; the triangle the slips make is the cost. -->
<svg xmlns="http://www.w3.org/2000/svg" class="lit-specimen" viewBox="0 0 320 180" width="320" height="180" role="img" aria-labelledby="specimen-ii-title specimen-ii-desc" focusable="false">
  <title id="specimen-ii-title">Every reply re-reads everything</title>
